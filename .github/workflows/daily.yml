name: daily-breezeup-email

# Daily cron is disabled because the GitHub Actions runner IP gets challenged
# by Racing Post's bot filter (Fastly), so server-side fetches consistently
# fail. Production runs are scheduled on a laptop instead. This workflow is
# kept for ad-hoc manual triggers - particularly --demo which bypasses the
# live fetch entirely and is useful for verifying email rendering.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to process (default: today UK)"
        required: false
      dry_run:
        description: "Render but do not send"
        required: false
        default: "false"
      demo:
        description: "Skip live RP fetch; render with hardcoded Craven 2026 lots"
        required: false
        default: "false"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:           ${{ secrets.EMAIL_TO }}
      NOTIFY_ON_EMPTY:    ${{ vars.NOTIFY_ON_EMPTY || 'false' }}
      ENTRIES_WINDOW_DAYS: ${{ vars.ENTRIES_WINDOW_DAYS || '5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run daily job
        run: |
          args=""
          if [ -n "${{ github.event.inputs.date }}" ]; then args="$args --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then args="$args --demo"; fi
          python -m dailybreezeup.daily $args

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            data/last_preview.html
            data/last_preview.txt
          if-no-files-found: ignore
