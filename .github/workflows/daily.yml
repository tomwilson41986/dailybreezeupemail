name: daily-breezeup-email

# Two scheduled runs per day plus manual dispatch:
#   04:00 UTC - morning run (--mode morning): entries & declarations in the
#               next 3 days. 04:00 UTC = 05:00 BST / 04:00 GMT. Off-the-hour
#               avoidance isn't applied because GHA cron throttling primarily
#               bites at the top of business hours; 04:00 UTC is quiet.
#               Suppressed when empty unless notify_on_empty=true.
#   21:00 UTC - evening run (--mode evening): results that ran today. Always
#               sends, even on a quiet day (subject: "No Results Today").
#
# 28 Apr 2026: the previous cron attempt failed because the default
# `requests` library exposes a Python TLS fingerprint that Racing Post's
# Fastly bot filter rejects from CI IPs. We now use curl_cffi
# (impersonate=chrome124), which mimics a real Chrome TLS/HTTP-2 handshake;
# sandbox testing confirms 885 lots scraped successfully from a cloud IP.
# If the cron starts emitting sales_found=4 lots_total=0 again, RP has
# tightened their rules - either bump the impersonate version or fall back
# to a Hetzner VPS.
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to process (default: today UK)"
        required: false
      dry_run:
        description: "Render but do not send"
        required: false
        default: "false"
      demo:
        description: "Skip live RP fetch; render with hardcoded Craven 2026 lots"
        required: false
        default: "false"
      mode:
        description: "morning (entries) or evening (results). Blank = pick from time of day."
        required: false
        type: choice
        options: ["", "morning", "evening"]
        default: ""
      entries_window_days:
        description: "Override forward window (days). Blank = use repo default (3)."
        required: false
      notify_on_empty:
        description: "Send 'no horses today' email if total=0. Blank = use repo default. Type 'true' or 'false'."
        required: false
      backfill_from:
        description: "One-shot historical scrape: walk RP results from this YYYY-MM-DD through today and write to results_archive. Doesn't send email."
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:           ${{ secrets.EMAIL_TO }}
      # Per-dispatch input wins; otherwise fall back to repo variable, then default.
      NOTIFY_ON_EMPTY: >-
        ${{ github.event.inputs.notify_on_empty
            || vars.NOTIFY_ON_EMPTY
            || 'false' }}
      ENTRIES_WINDOW_DAYS: >-
        ${{ github.event.inputs.entries_window_days
            || vars.ENTRIES_WINDOW_DAYS
            || '3' }}
      # Schedule cron's `schedule` event has no inputs, so derive mode from
      # the cron expression. workflow_dispatch can override via the input.
      RUN_MODE: >-
        ${{ github.event.inputs.mode
            || (github.event.schedule == '0 21 * * *' && 'evening')
            || 'morning' }}
      # Lets a fork/repo-variable point at a different sheet without code changes.
      SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Persist the SQLite DB (email_log + results_archive) across runs so
      # the season-to-date summary at the bottom of the evening email
      # accumulates instead of resetting on every ephemeral runner. Cache
      # key is unique per run so we always save a fresh snapshot; the
      # restore-keys prefix means we always pull the most recent save.
      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: |
            data/breezeup.sqlite
            data/breezeup.sqlite-shm
            data/breezeup.sqlite-wal
          key: breezeup-db-v1-${{ github.run_id }}
          restore-keys: |
            breezeup-db-v1-

      - name: Run daily job
        run: |
          if [ -n "${{ github.event.inputs.backfill_from }}" ]; then
            python -m dailybreezeup.daily --backfill-from "${{ github.event.inputs.backfill_from }}"
          else
            args="--mode ${RUN_MODE}"
            if [ -n "${{ github.event.inputs.date }}" ]; then args="$args --date ${{ github.event.inputs.date }}"; fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
            if [ "${{ github.event.inputs.demo }}" = "true" ]; then args="$args --demo"; fi
            python -m dailybreezeup.daily $args
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Daily breeze-up email"
            echo ""
            echo "- date: \`${{ github.event.inputs.date || 'today UK' }}\`"
            echo "- dry_run: \`${{ github.event.inputs.dry_run || 'false' }}\`"
            echo "- demo: \`${{ github.event.inputs.demo || 'false' }}\`"
            echo "- mode: \`${RUN_MODE}\`"
            echo "- entries_window_days: \`${ENTRIES_WINDOW_DAYS}\`"
            echo "- notify_on_empty: \`${NOTIFY_ON_EMPTY}\`"
            if [ -f data/last_preview.txt ]; then
              echo ""
              echo "<details><summary>Plain-text preview</summary>"
              echo ""
              echo '```'
              cat data/last_preview.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            data/last_preview.html
            data/last_preview.txt
          if-no-files-found: ignore
