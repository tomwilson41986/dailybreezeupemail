name: weekly-catalogue-refresh

on:
  schedule:
    - cron: "0 4 * * 0"  # Sundays 04:00 UTC — quiet hour
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years to seed (default: current year)"
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .

      - name: Seed catalogues
        run: |
          years="${{ github.event.inputs.years }}"
          if [ -z "$years" ]; then years="$(date +%Y)"; fi
          python -m dailybreezeup.seed --all --years $years -v

      - name: Commit refreshed catalogue
        run: |
          git config user.name  "breezeup-bot"
          git config user.email "breezeup-bot@users.noreply.github.com"
          if ! git diff --quiet -- data/breezeup.sqlite; then
            git add data/breezeup.sqlite
            git commit -m "chore: refresh sale catalogues $(date -u +'%Y-%m-%d')"
            git push
          fi
