[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailybreezeup"
version = "0.1.0"
description = "Daily email listing UK/IRE/FR racing activity for breeze-up sale graduates"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  # curl_cffi impersonates Chrome's TLS/HTTP-2 fingerprint, which is what
  # gets us past Racing Post's Fastly bot challenge from cloud IPs.
  "curl_cffi>=0.7",
  "lxml>=5.2",
  # cssselect powers lxml's .cssselect() used by the salescatalogues scrapers.
  "cssselect>=1.2",
  "jinja2>=3.1",
  # BeautifulSoup parses the France Galop / Deutscher Galopp / irishracing
  # pages; reportlab draws the Wathnan runners PDF.
  "beautifulsoup4>=4.12",
  "reportlab>=4.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tenacity>=8.4",
  # Silk SVGs are rasterised to white-backed PNG at email send time so
  # Gmail (which strips remote and inline SVG) renders them inline as
  # CID-attached PNGs. resvg-py ships statically linked binary wheels
  # for every platform — no system Cairo dep on Windows.
  "resvg-py>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  # pdfplumber reads the generated PDF back to assert its layout.
  "pdfplumber>=0.11",
  "ruff>=0.5",
  "mypy>=1.10",
]
# scripts/racing_results_xlsx.py
xlsx = [
  "openpyxl>=3.1",
]

[project.scripts]
breezeup-daily = "dailybreezeup.daily:main"
barriertrials-daily = "barriertrials.daily:main"
salescatalogues-daily = "salescatalogues.daily:main"
wathnan-daily = "wathnan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailybreezeup = ["schema.sql", "templates/*.j2"]
barriertrials = ["schema.sql", "templates/*.j2"]
salescatalogues = ["schema.sql", "templates/*.j2"]
# The runners PDF ships its own fonts and brand marks, plus the canonical
# name / country / roster registries it reconciles feeds against.
wathnan = ["assets/*.png", "assets/fonts/*.ttf", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
